name: Release

# Pushing a tag v<version> (see `bun run release`) publishes to npm and then
# creates the GitHub release, with notes taken from CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - name: Check the tag and read the release notes
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v$VERSION"
            exit 1
          fi
          for PKG in simulator studio; do
            PKG_VERSION=$(node -p "require('./packages/$PKG/package.json').version")
            if [ "$PKG_VERSION" != "$VERSION" ]; then
              echo "::error::packages/$PKG/package.json is at $PKG_VERSION, easytg at $VERSION: they are released together"
              exit 1
            fi
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # Prereleases (1.2.0-beta.1) go to the "next" dist-tag so they don't become "latest".
          if [[ "$VERSION" == *-* ]]; then
            echo "NPM_TAG=next" >> "$GITHUB_ENV"
            echo "PRERELEASE=true" >> "$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >> "$GITHUB_ENV"
            echo "PRERELEASE=false" >> "$GITHUB_ENV"
          fi

          # The "## <version> (date)" section of CHANGELOG.md becomes the release notes.
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no \"## $VERSION\" section"
            exit 1
          fi

      - run: bun install --frozen-lockfile

      # Each package goes after the ones it depends on: simulator, studio, easytg.
      # All are built and checked before any is uploaded (easytg's prepublishOnly
      # runs the same checks again).
      - name: Check and build
        run: bun run typecheck && bun test && bun run build

      # A version already on npm (e.g. a package's first version, published by
      # hand) is skipped: the script checks right before publishing.
      - name: Publish @easytg/simulator to npm
        run: bash scripts/publish-package.sh packages/simulator
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @easytg/studio to npm
        run: bash scripts/publish-package.sh packages/studio
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # prepublishOnly runs typecheck, tests and build once more.
      - name: Publish easytg to npm
        run: bash scripts/publish-package.sh .
        env:
          # Only needed without trusted publishing.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ env.PRERELEASE == 'true' }}
